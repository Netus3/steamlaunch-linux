name: Tests and Linux release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python -m pip install --no-deps -e . && python -m pip install 'ruff>=0.12'
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ruff check steamlaunch tests scripts packaging

  build:
    runs-on: ubuntu-22.04
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Display libraries and headless test servers
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb weston dbus-x11 desktop-file-utils libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libx11-xcb1
      - run: python -m pip install -r packaging/requirements-build.txt
      - run: python -m pip install --no-deps -e .
      - name: Check tag/version agreement
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: python -c 'import os; from steamlaunch import __version__; assert os.environ["TAG"] == "v" + __version__'
      - run: python scripts/build_release.py --label release
      - name: Offscreen binary / installation / wrapper tests
        run: python scripts/check_release.py dist/*-linux-x86_64.tar.gz
      - name: X11 binary tests
        run: xvfb-run -a python scripts/check_release.py dist/*-linux-x86_64.tar.gz --platform xcb
      - name: Native Wayland binary tests
        run: |
          export XDG_RUNTIME_DIR="$(mktemp -d)"
          chmod 700 "$XDG_RUNTIME_DIR"
          weston --backend=headless-backend.so --socket=steamlaunch-ci --idle-time=0 >weston-ci.log 2>&1 &
          WESTON_PID=$!
          trap 'kill "$WESTON_PID" 2>/dev/null || true' EXIT
          python -c 'import os,time; from pathlib import Path; p=Path(os.environ["XDG_RUNTIME_DIR"])/"steamlaunch-ci"; deadline=time.monotonic()+15; exec("while not p.exists() and time.monotonic()<deadline: time.sleep(0.1)"); assert p.exists(), "Weston did not start"'
          WAYLAND_DISPLAY=steamlaunch-ci python scripts/check_release.py dist/*-linux-x86_64.tar.gz --platform wayland
      - uses: actions/upload-artifact@v4
        with:
          name: steamlaunch-linux-x86_64
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: steamlaunch-linux-x86_64
          path: artifacts
      - name: Create draft only; publishing is a maintainer decision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" artifacts/* --draft --verify-tag --title "SteamLaunch $TAG" --notes "Linux x86_64 binary, matching source and SHA256 checksums. See README for requirements and safety notes."
