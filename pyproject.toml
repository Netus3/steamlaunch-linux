[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "steamlaunch-linux"
dynamic = ["version"]
description = "A small Linux GUI for custom Steam/Proton launch profiles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11"
dependencies = ["PySide6-Essentials>=6.8,<7"]

[project.optional-dependencies]
dev = ["ruff>=0.12"]
build = ["pyinstaller>=6.16,<7", "build>=1.0"]

[tool.setuptools.dynamic]
version = {attr = "steamlaunch.__version__"}

[tool.setuptools.package-data]
steamlaunch = ["assets/*.svg"]

[project.scripts]
steamlaunch = "steamlaunch.__main__:main"

[tool.setuptools.packages.find]
include = ["steamlaunch*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/test_gui.py" = ["E402"]
